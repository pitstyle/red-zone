<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RED ZONE" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="RED ZONE — photo book by Tamara Wyrzykowska and poems by Iryna Ciłyk. Gdańsk 2023."
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <title>RED ZONE</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar" id="topbar">
        <div class="brand">
          <span class="brand-red">Red</span>
          <span class="brand-zone">ZONE</span>
        </div>
        <div class="topbar-actions">
          <button type="button" class="icon-btn" id="chapters-toggle" aria-label="Chapters">
            01–11
          </button>
        </div>
      </header>

      <main class="book" id="book" aria-label="Book">
        <div class="stack" id="stack"></div>
        <section class="contact-page" id="contact-page" aria-label="Contact">
          <div class="contact-inner">
            <p class="contact-mark"><span class="brand-red">Red</span> ZONE</p>
            <h1 class="contact-name">Tamara Wyrzykowska</h1>
            <p class="contact-role">Professional photographer</p>
            <p class="contact-place">Currently based in Poland</p>
            <div class="contact-rule" aria-hidden="true"></div>
            <p class="contact-lead">
              For info, questions, bookings or prints
            </p>
            <p class="contact-links">
              <a href="mailto:tamarawyrzykowska@gmail.com">tamarawyrzykowska@gmail.com</a>
            </p>
            <p class="contact-links">
              <a
                href="https://www.instagram.com/tamara_wyrzykowska"
                target="_blank"
                rel="noopener noreferrer"
                >Instagram — @tamara_wyrzykowska</a
              >
            </p>
            <p class="contact-colophon">
              Photos · Tamara Wyrzykowska<br />
              Poems · Iryna Ciłyk<br />
              Gdańsk 2023
            </p>
          </div>
        </section>
      </main>

      <nav class="chapter-rail" id="chapter-rail" aria-label="Chapters" hidden>
        <div class="chapter-rail-inner">
          <p class="chapter-rail-title">Chapters</p>
          <div class="chapter-list" id="chapter-list"></div>
          <button type="button" class="chapter-btn contact-nav" id="contact-nav">
            <strong>Contact</strong>
            <span>Tamara Wyrzykowska</span>
          </button>
          <button type="button" class="close-rail" id="close-rail">Close</button>
        </div>
      </nav>

      <footer class="bottombar" id="bottombar">
        <span id="page-label">1 / 78</span>
        <span id="chapter-label"></span>
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
